{% extends 'base.html' %}

{% block title %}Início - Logistica Facil{% endblock %}

{% block content %}

    <h1>Essa é a tela Home</h1>

    {% if user.is_authenticated %}
        <p>Bem-vindo, <strong>{{ user.username }}</strong>!</p>
        <a href="{% url 'logout' %}">Sair</a>
    {% else %}
        <p>Você não está logado.</p>
        <a href="{% url 'login' %}">Fazer Login</a>
    {% endif %}

{% endblock %}
