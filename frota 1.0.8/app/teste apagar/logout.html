<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Bem-vindo à página Home</h1>

    {% if user.is_authenticated %}
        <p>Bem-vindo, <strong>{{ user.username }}</strong>!</p>
        
        <a href="{% url 'logout' %}">Sair</a>
    {% else %}
        <p>Você não está logado.</p>
        <a href="{% url 'login' %}">Fazer Login</a>
    {% endif %}
</body>
</html>
